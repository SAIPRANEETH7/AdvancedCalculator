<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Responsive Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="theme-toggle">
    <button id="theme-btn">🌙</button>
  </div>

  <div class="calculator">
    <div class="display-container">
      <div id="history"></div>
      <input type="text" id="display" disabled />
    </div>

    <div class="buttons">
      <button class="btn" data-value="C">C</button>
      <button class="btn" data-value="DEL">DEL</button>
      <button class="btn" data-value="%">%</button>
      <button class="btn op" data-value="/">÷</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn op" data-value="*">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn op" data-value="-">−</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn op" data-value="+">+</button>

      <button class="btn" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn equals" data-value="=">=</button>
    </div>

    <div class="sci-toggle-container">
      <button id="sci-toggle">Scientific Mode</button>
    </div>

    <div class="scientific-buttons hidden" aria-hidden="true">
      <button class="btn sci" data-func="sin">sin</button>
      <button class="btn sci" data-func="cos">cos</button>
      <button class="btn sci" data-func="tan">tan</button>
      <button class="btn sci" data-func="log">log</button>

      <button class="btn sci" data-func="sqrt">√</button>
      <button class="btn sci" data-func="pi">π</button>
      <button class="btn sci" data-func="e">e</button>
      <button class="btn sci" data-func="pow">xʸ</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
